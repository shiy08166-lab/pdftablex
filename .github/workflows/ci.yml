name: CI

on:
  # Any branch, deliberately: a workflow that silently does not run because the
  # branch is called something else is worse than one that runs too often.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src examples tests skills

      - name: Check the skill references are in sync with docs/
        run: python skills/sync_references.py --check

      - name: Tests
        run: pytest tests -q

      - name: End-to-end demo must reach zero differences
        run: |
          python examples/make_synthetic_pdf.py --outdir examples/synthetic
          python examples/demo.py

      - name: Public-data demo (fetch, simulate an export, recover it)
        run: |
          python examples/fetch_public.py
          python examples/demo_public.py --rows 200 --stride 401

      - name: The single-file fallback must still run
        run: |
          cd examples/synthetic
          python ../../skills/pdf-table-extraction/scripts/extract_skeleton.py recon catalogue.pdf
          python ../../skills/pdf-table-extraction/scripts/extract_skeleton.py extract catalogue.pdf

  no-data-leak:
    # The repository ships method, code and synthetic samples only. This job
    # fails the build if a real document or a spreadsheet ever reaches a commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse tracked binary documents and data files
        run: |
          set -e
          offenders=$(git ls-files \
            | grep -Ev '^examples/synthetic/' \
            | grep -Ei '\.(pdf|xlsx?|xlsm|csv|tsv|docx?|pptx?|sql|db|sqlite3?|png|jpe?g|tiff?)$' \
            || true)
          if [ -n "$offenders" ]; then
            echo "::error::Tracked files that may contain real data:"
            echo "$offenders"
            echo
            echo "Only files under examples/synthetic/ may be committed."
            echo "See the 'Data safety' section of README.md."
            exit 1
          fi
          echo "No tracked documents or data files outside examples/synthetic/."
